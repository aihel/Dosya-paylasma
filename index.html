<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>update #4</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#1e1f22;
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box {
  background:#2b2d31;
  padding:20px;
  border-radius:10px;
}

input, button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:6px;
}

input {background:#1e1f22;color:white;}
button {background:#5865f2;color:white;cursor:pointer;}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:80px;
  background:#111214;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
}

.sideBtn {
  margin:5px;
  cursor:pointer;
}

/* MAIN */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* HEADER */
#header {
  background:#2b2d31;
  padding:10px;
}

/* MESSAGES */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  display:flex;
  margin:10px 0;
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
}

.copyBtn {
  margin-left:10px;
  font-size:20px;
  cursor:pointer;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:10px;
  background:#383a40;
}

#msgInput {
  flex:1;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>Giriş</h3>
    <input id="username" placeholder="Kullanıcı adı"><br>
    <input type="file" id="avatarInput"><br>
    <button onclick="login()">Giriş</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="sidebar">
    <div class="sideBtn" onclick="setRoom('global')">🌍</div>
    <div class="sideBtn" onclick="addFriend()">➕</div>
  </div>

  <div id="main">
    <div id="header"># global</div>
    <div id="messages"></div>

    <div id="inputArea">
      <input type="file" id="fileInput" hidden>
      <button onclick="fileInput.click()">📎</button>
      <input id="msgInput" placeholder="Mesaj...">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username="", avatar="", room="global";
let friends = [];

// HTML kontrol
function containsHTML(str){
  return /<[^>]*>/.test(str);
}

// LOGIN
window.login = function(){
  const name = usernameInput.value;
  const file = avatarInput.files[0];

  if(!name || !file) return alert("Eksik!");

  const reader = new FileReader();
  reader.onload = e=>{
    username = name;
    avatar = e.target.result;

    login.style.display="none";
    chat.style.display="flex";

    Notification.requestPermission();

    loadMessages();
  };
  reader.readAsDataURL(file);
};

// ROOM
window.setRoom = function(r){
  room = r;
  messages.innerHTML="";
  header.innerText="# "+r;
  loadMessages();
};

// FRIEND
window.addFriend = function(){
  const f = prompt("Kullanıcı adı:");
  if(f) friends.push(f);
};

// SEND
window.sendMsg = function(){
  const text = msgInput.value;
  const file = fileInput.files[0];

  if(!text && !file) return;

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      push(ref(db,"messages"),{
        username,avatar,room,
        image:e.target.result,
        text
      });
    };
    reader.readAsDataURL(file);
    fileInput.value="";
  } else {
    push(ref(db,"messages"),{
      username,avatar,room,text
    });
  }

  msgInput.value="";
};

// LOAD
function loadMessages(){
  onChildAdded(ref(db,"messages"), snap=>{
    const msg = snap.val();
    if(!msg || msg.room!==room) return;

    const div = document.createElement("div");
    div.className="msg";

    div.innerHTML=`
      <img src="${msg.avatar}" class="avatar">
      <div>
        <b>${msg.username}</b>
        <span class="copyBtn">📋</span>
        <div>${msg.text || ""}</div>
        ${msg.image ? `<img src="${msg.image}" width="150">` : ""}
      </div>
    `;

    div.querySelector(".copyBtn").onclick = ()=>{
      navigator.clipboard.writeText(msg.text || "");
    };

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    // 🔔 NORMAL BİLDİRİM
    if(msg.username !== username && Notification.permission==="granted"){
      new Notification(msg.username+": "+(msg.text||"📷"));
    }

    // ⚠️ HTML BİLDİRİM (SADECE GLOBAL)
    if(room==="global" && containsHTML(msg.text||"")){
      alert("⚠️ HTML kod mesajı geldi!");
    }
  });
}
</script>

</body>
</html>
