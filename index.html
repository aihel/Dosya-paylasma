<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dc gibi duzelltim ama</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body {
  background:#313338;
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box {
  background:#2b2d31;
  padding:20px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

input {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:6px;
  width:220px;
  background:#1e1f22;
  color:white;
}

button {
  padding:10px;
  border:none;
  border-radius:6px;
  background:#5865f2;
  color:white;
  cursor:pointer;
  width:100%;
}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
#header {
  padding:10px;
  background:#2b2d31;
  font-weight:bold;
}

/* MESSAGES */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE */
.msg {
  display:flex;
  margin:10px 0;
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
}

.content {
  flex:1;
}

.username {
  font-size:14px;
  font-weight:bold;
}

.text {
  font-size:15px;
  margin-top:2px;
  word-break:break-word;
}

/* COPY */
.copyBtn {
  margin-left:8px;
  cursor:pointer;
  font-size:20px; /* BÜYÜTTÜM */
  opacity:0.7;
}

.copyBtn:hover {
  opacity:1;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:10px;
  background:#383a40;
}

#msgInput {
  flex:1;
  padding:10px;
  border-radius:6px;
  border:none;
  background:#1e1f22;
  color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>Giriş Yap</h3>
    <input id="username" placeholder="Kullanıcı adı">
    <input type="file" id="avatarInput" accept="image/*">
    <button onclick="login()">Giriş</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header"># sohbet</div>
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msgInput" placeholder="Mesaj yaz...">
    <button onclick="sendMsg()">Gönder</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";
let avatar = "";

// HTML escape (preview engelle)
function escapeHTML(text){
  return text.replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// LOGIN FIXED
window.login = function() {
  const name = document.getElementById("username").value;
  const file = document.getElementById("avatarInput").files[0];

  if(!name || !file) return alert("Eksik!");

  const reader = new FileReader();
  reader.onload = e => {
    username = name;
    avatar = e.target.result;

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";

    loadMessages();
  };
  reader.readAsDataURL(file);
};

// SEND
window.sendMsg = function(){
  const text = document.getElementById("msgInput").value;
  if(!text) return;

  push(ref(db,"messages"),{
    username,
    avatar,
    text
  });

  document.getElementById("msgInput").value="";
};

// LOAD
function loadMessages(){
  const container = document.getElementById("messages");

  onChildAdded(ref(db,"messages"), snap=>{
    const msg = snap.val();
    if(!msg) return;

    const div = document.createElement("div");
    div.className="msg";

    div.innerHTML=`
      <img src="${msg.avatar}" class="avatar">
      <div class="content">
        <div>
          <span class="username">${msg.username}</span>
          <span class="copyBtn">📋</span>
        </div>
        <div class="text">${escapeHTML(msg.text)}</div>
      </div>
    `;

    div.querySelector(".copyBtn").onclick = ()=>{
      navigator.clipboard.writeText(msg.text);
    };

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  });
}
</script>

</body>
</html>
