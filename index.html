<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lukarix</title>

<style>
body {margin:0;font-family:Arial;background:#1e1f22;color:white;}
#login,#chat{height:100vh;display:flex;justify-content:center;align-items:center;}
#chat{display:none;}

.login-box{background:#2b2d31;padding:20px;border-radius:10px;}
input,button{padding:10px;margin:5px;border:none;border-radius:6px;}
input{background:#1e1f22;color:white;}
button{background:#5865f2;color:white;cursor:pointer;}

#layout{display:flex;width:100%;height:100vh;}
#sidebar{width:70px;background:#111214;padding:10px;text-align:center;}
.sideBtn{margin:10px 0;cursor:pointer;}

#main{flex:1;display:flex;flex-direction:column;}
#header{background:#2b2d31;padding:10px;}

#messages{flex:1;overflow:auto;padding:10px;}
.msg{display:flex;margin:10px 0;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:10px;}

.copyBtn{margin-left:10px;font-size:20px;cursor:pointer;}

#inputArea{display:flex;padding:10px;background:#383a40;}
#msgInput{flex:1;}

#adminPanel{
  position:fixed;
  top:10px;
  right:10px;
  background:#000;
  padding:10px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>Giriş</h3>
    <input id="username" placeholder="Kullanıcı adı">
    <input type="file" id="avatarInput" accept="image/*">
    <button onclick="login()">Giriş</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="layout">

    <div id="sidebar">
      <div class="sideBtn" onclick="setRoom('global')">🌍</div>
    </div>

    <div id="main">
      <div id="header"># global</div>
      <div id="messages"></div>

      <div id="inputArea">
        <input type="file" id="fileInput" hidden accept="image/*">
        <button onclick="fileInput.click()">📎</button>
        <input id="msgInput" placeholder="Mesaj yaz...">
        <button onclick="sendMsg()">➤</button>
      </div>
    </div>

  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <b>ADMIN</b><br>
  <button onclick="clearChat()">Chat Temizle</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username="", avatar="", room="global", isAdmin=false;

// HTML escape
function escapeHTML(t){
  return t.replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// LOGIN
window.login = function(){
  let name = document.getElementById("username").value.trim();
  const file = document.getElementById("avatarInput").files[0];

  if(!name || !file) return alert("Eksik!");

  // ADMIN KOD
  if(name === "1893"){
    name = "Lukarix";
    isAdmin = true;
  }

  username = name;

  const reader = new FileReader();
  reader.onload = e=>{
    avatar = e.target.result;

    document.getElementById("login").style.display="none";
    document.getElementById("chat").style.display="block";

    if(isAdmin){
      document.getElementById("adminPanel").style.display="block";
    }

    Notification.requestPermission();

    loadMessages();
  };
  reader.readAsDataURL(file);
};

// ROOM
window.setRoom = function(r){
  room = r;
  messages.innerHTML="";
};

// SEND
window.sendMsg = function(){
  const text = msgInput.value;
  const file = fileInput.files[0];

  if(!text && !file) return;

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      push(ref(db,"messages"),{
        username,avatar,room,
        image:e.target.result,
        text
      });
    };
    reader.readAsDataURL(file);
  } else {
    push(ref(db,"messages"),{
      username,avatar,room,text
    });
  }

  msgInput.value="";
  fileInput.value="";
};

// LOAD
function loadMessages(){
  onChildAdded(ref(db,"messages"), snap=>{
    const msg = snap.val();
    if(!msg || msg.room!==room) return;

    const div = document.createElement("div");
    div.className="msg";

    div.innerHTML=`
      <img src="${msg.avatar}" class="avatar">
      <div>
        <b>${msg.username}</b>
        <span class="copyBtn">📋</span>
        <div>${escapeHTML(msg.text||"")}</div>
        ${msg.image ? `<img src="${msg.image}" width="140">` : ""}
      </div>
    `;

    div.querySelector(".copyBtn").onclick = ()=>{
      navigator.clipboard.writeText(msg.text||"");
    };

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    // 🔔 BİLDİRİM
    if(msg.username !== username && Notification.permission==="granted"){
      new Notification(msg.username + ": " + (msg.text||"📷"));
    }
  });
}

// ADMIN
window.clearChat = function(){
  remove(ref(db,"messages"));
};
</script>

</body>
</html>
