<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aliyle proje amk</title>

<style>
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial;
}

body {
  background:#0f172a;
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  width:80%;
  max-width:280px;
}

button {
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}

/* CHAT */
#chat {
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  flex-direction:column;
}

/* MESSAGES */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE */
.msg {
  display:flex;
  background:#1e293b;
  padding:8px;
  border-radius:10px;
  margin:6px 0;
  position:relative;
}

.avatar {
  width:35px;
  height:35px;
  border-radius:50%;
  margin-right:8px;
}

.content {
  flex:1;
}

.username {
  font-size:13px;
  font-weight:bold;
}

.text {
  font-size:14px;
}

/* COPY */
.copyBtn {
  position:absolute;
  right:8px;
  top:5px;
  cursor:pointer;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:5px;
  background:#020617;
}

#msgInput {
  flex:1;
}
</style>
</head>

<body>

<div id="login">
  <h3>Giriş</h3>
  <input id="username" placeholder="Kullanıcı adı">
  <input type="file" id="avatarInput" accept="image/*">
  <button onclick="login()">Gir</button>
</div>

<div id="chat">
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msgInput" placeholder="Mesaj yaz...">
    <button onclick="sendMsg()">Gönder</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay",
  storageBucket: "kodspay.firebasestorage.app",
  messagingSenderId: "1090801429526",
  appId: "1:1090801429526:web:635a56f291de6623829937"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";
let avatar = "";

// LOGIN
window.login = function() {
  username = document.getElementById("username").value;
  const file = document.getElementById("avatarInput").files[0];

  if(!username || !file){
    alert("Hepsini doldur!");
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    avatar = e.target.result;

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";

    loadMessages();
  };
  reader.readAsDataURL(file);
};

// SEND
window.sendMsg = function() {
  const text = document.getElementById("msgInput").value;
  if(!text) return;

  push(ref(db, "messages"), {
    username,
    avatar,
    text,
    time: Date.now()
  });

  document.getElementById("msgInput").value = "";
};

// LOAD
function loadMessages() {
  const container = document.getElementById("messages");

  onChildAdded(ref(db, "messages"), snapshot => {
    const msg = snapshot.val();

    if(!msg || !msg.text) return; // FIX

    const div = document.createElement("div");
    div.className = "msg";

    div.innerHTML = `
      <img src="${msg.avatar}" class="avatar">
      <div class="content">
        <div class="username">${msg.username}</div>
        <div class="text">${msg.text}</div>
      </div>
      <div class="copyBtn">📋</div>
    `;

    div.querySelector(".copyBtn").onclick = () => {
      navigator.clipboard.writeText(msg.text);
    };

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  });
}
</script>

</body>
</html>
