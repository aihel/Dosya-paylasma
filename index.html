<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basit Kod paylasma by lukarix</title>
<style>
body {margin:0;font-family:Arial;background:#1e1f22;color:white;}
#login,#chat{height:100vh;display:flex;justify-content:center;align-items:center;}
#chat{display:none;}
.login-box{background:#2b2d31;padding:20px;border-radius:10px;}
input,button{padding:10px;margin:5px;border:none;border-radius:6px;}
input{background:#1e1f22;color:white;}
button{background:#5865f2;color:white;cursor:pointer;}
#messages{height:60vh;overflow:auto;padding:10px;}
.msg{display:flex;margin:10px 0;}
.avatar{width:40px;height:40px;border-radius:50%;margin-right:10px;}
.copyBtn{margin-left:10px;cursor:pointer;}
#inputArea{display:flex;padding:10px;background:#383a40;}
#msgInput{flex:1;}
img.msgImg{max-width:120px;margin-top:5px;border-radius:6px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>Giriş</h3>
    <input id="username" placeholder="Kullanıcı adı">
    <input type="file" id="avatarInput" accept="image/*"><br>
    <button onclick="login()">Giriş</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div style="flex:1;display:flex;flex-direction:column;max-width:600px;margin:auto;width:100%;">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="file" id="fileInput" hidden accept="image/*">
      <button onclick="fileInput.click()">📎</button>
      <input id="msgInput" placeholder="Mesaj yaz...">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username="", avatar="";

// Giriş
window.login = function(){
  const name = document.getElementById("username").value.trim();
  const file = document.getElementById("avatarInput").files[0];
  if(!name || !file) return alert("Eksik!");
  username = name;

  const reader = new FileReader();
  reader.onload = e=>{
    avatar = e.target.result;
    document.getElementById("login").style.display="none";
    document.getElementById("chat").style.display="flex";
    loadMessages();
  };
  reader.readAsDataURL(file);
};

// Gönder
window.sendMsg = function(){
  const text = document.getElementById("msgInput").value.trim();
  const file = document.getElementById("fileInput").files[0];
  if(!text && !file) return;

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      push(ref(db,"messages"),{
        username, avatar,
        text, image:e.target.result
      });
    };
    reader.readAsDataURL(file);
    document.getElementById("fileInput").value="";
  } else {
    push(ref(db,"messages"),{username, avatar, text});
  }

  document.getElementById("msgInput").value="";
};

// Mesajları yükle
function escapeHTML(str){
  return str.replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function loadMessages(){
  onChildAdded(ref(db,"messages"), snap=>{
    const msg = snap.val();
    if(!msg) return;

    const div = document.createElement("div");
    div.className="msg";
    div.innerHTML=`
      <img src="${msg.avatar}" class="avatar">
      <div>
        <b>${msg.username}</b>
        <span class="copyBtn">📋</span>
        <div>${escapeHTML(msg.text||"")}</div>
        ${msg.image ? `<img src="${msg.image}" class="msgImg">` : ""}
      </div>
    `;

    div.querySelector(".copyBtn").onclick = ()=>navigator.clipboard.writeText(msg.text||"");
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
  });
}
</script>
</body>
</html>
