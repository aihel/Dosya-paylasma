<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Helelele update</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body {
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.login-box {
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

input {
  padding:10px;
  margin:6px;
  border:none;
  border-radius:12px;
  width:220px;
}

button {
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#22c55e,#16a34a);
  color:white;
  cursor:pointer;
}

/* CHAT */
#chat {
  display:none;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
#header {
  padding:10px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
}

/* MESSAGES */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE */
.msg {
  display:flex;
  margin:8px 0;
}

.msg.me {
  justify-content:flex-end;
}

.bubble {
  max-width:75%;
  padding:10px;
  border-radius:15px;
  background:#1e293b;
  position:relative;
}

.msg.me .bubble {
  background:#22c55e;
}

.avatar {
  width:30px;
  height:30px;
  border-radius:50%;
  margin:0 6px;
}

.username {
  font-size:11px;
  opacity:0.7;
}

.text {
  font-size:14px;
  word-break:break-word;
}

/* COPY */
.copyBtn {
  position:absolute;
  right:6px;
  top:4px;
  font-size:13px;
  cursor:pointer;
  opacity:0.7;
}

.copyBtn:hover {
  opacity:1;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:8px;
  background:#020617;
}

#msgInput {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h3>Chat</h3>
    <input id="username" placeholder="Kullanıcı adı">
    <input type="file" id="avatarInput" accept="image/*">
    <button onclick="login()">Başla</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">💬 Sohbet</div>
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msgInput" placeholder="Mesaj yaz...">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIu9z9sd5lKf75K4hckxohQ7gv6oKkF_Y",
  authDomain: "kodspay.firebaseapp.com",
  databaseURL: "https://kodspay-default-rtdb.firebaseio.com",
  projectId: "kodspay"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";
let avatar = "";

// TEXT GÜVENLİK (HTML ÇALIŞMAZ)
function escapeHTML(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// LOGIN
window.login = function() {
  username = document.getElementById("username").value;
  const file = document.getElementById("avatarInput").files[0];

  if(!username || !file) return alert("Eksik!");

  const reader = new FileReader();
  reader.onload = e => {
    avatar = e.target.result;

    login.style.display = "none";
    chat.style.display = "flex";

    loadMessages();
  };
  reader.readAsDataURL(file);
};

// SEND
window.sendMsg = function() {
  let text = document.getElementById("msgInput").value;
  if(!text) return;

  push(ref(db, "messages"), {
    username,
    avatar,
    text
  });

  msgInput.value = "";
};

// LOAD
function loadMessages() {
  const container = document.getElementById("messages");

  onChildAdded(ref(db, "messages"), snapshot => {
    const msg = snapshot.val();
    if(!msg) return;

    const isMe = msg.username === username;

    const div = document.createElement("div");
    div.className = "msg " + (isMe ? "me" : "");

    div.innerHTML = `
      ${!isMe ? `<img src="${msg.avatar}" class="avatar">` : ""}
      <div class="bubble">
        <div class="copyBtn">📋</div>
        <div class="username">${msg.username}</div>
        <div class="text">${escapeHTML(msg.text)}</div>
      </div>
      ${isMe ? `<img src="${msg.avatar}" class="avatar">` : ""}
    `;

    div.querySelector(".copyBtn").onclick = () => {
      navigator.clipboard.writeText(msg.text);
    };

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  });
}
</script>

</body>
</html>
